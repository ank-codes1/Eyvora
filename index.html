<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EYVORA</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    video {
      width: 700px;
      max-width: 95%;
      border-radius: 18px;
      border: 3px solid #38bdf8;
      margin-top: 18px;
    }

    button {
      margin: 12px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .status {
      margin-top: 16px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>EYVORA</h1>
  <h2>AI Driver Monitoring System</h2>

  <button id="startBtn">Start Camera + AI</button>

  <br>

  <video id="camera" autoplay playsinline></video>

  <div class="status" id="driverStatus">
    Driver: Waiting...
  </div>

  <div class="status" id="eyeStatus">
    Eyes: --
  </div>

  <script type="module">

    import vision from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const {
      FaceLandmarker,
      FilesetResolver
    } = vision;

    const video = document.getElementById("camera");
    const driverStatus = document.getElementById("driverStatus");
    const eyeStatus = document.getElementById("eyeStatus");
    const startBtn = document.getElementById("startBtn");

    let faceLandmarker;
    let lastVideoTime = -1;

    const EYE_CLOSED_THRESHOLD = 0.55;

    async function setupAI() {

      driverStatus.innerText = "AI: Loading...";

      const filesetResolver =
        await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );

      faceLandmarker =
        await FaceLandmarker.createFromOptions(
          filesetResolver,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
            },

            runningMode: "VIDEO",
            numFaces: 1,

            outputFaceBlendshapes: true,
            outputFacialTransformationMatrixes: true
          }
        );

      driverStatus.innerText = "AI: Ready";
    }

    async function startCamera() {

      if (!faceLandmarker) {
        alert("AI is still loading.");
        return;
      }

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

      video.srcObject = stream;

      video.addEventListener(
        "loadeddata",
        detectLoop,
        { once: true }
      );
    }

    function getBlendshapeScore(categories, name) {

      const item =
        categories.find(
          shape => shape.categoryName === name
        );

      return item ? item.score : 0;
    }

    function detectLoop() {

      if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
      ) {

        lastVideoTime = video.currentTime;

        const result =
          faceLandmarker.detectForVideo(
            video,
            performance.now()
          );

        if (
          result.faceLandmarks &&
          result.faceLandmarks.length > 0
        ) {

          driverStatus.innerText =
            "Driver: FACE DETECTED";

          if (
            result.faceBlendshapes &&
            result.faceBlendshapes.length > 0
          ) {

            const categories =
              result.faceBlendshapes[0].categories;

            const leftEye =
              getBlendshapeScore(
                categories,
                "eyeBlinkLeft"
              );

            const rightEye =
              getBlendshapeScore(
                categories,
                "eyeBlinkRight"
              );

            const eyeScore =
              (leftEye + rightEye) / 2;

            if (
              eyeScore >= EYE_CLOSED_THRESHOLD
            ) {

              eyeStatus.innerText =
                "Eyes: CLOSED";

              eyeStatus.style.color =
                "#ef4444";

            } else {

              eyeStatus.innerText =
                "Eyes: OPEN";

              eyeStatus.style.color =
                "#22c55e";
            }
          }

        } else {

          driverStatus.innerText =
            "Driver: NO FACE";

          eyeStatus.innerText =
            "Eyes: --";

          eyeStatus.style.color =
            "white";
        }
      }

      requestAnimationFrame(detectLoop);
    }

    startBtn.addEventListener(
      "click",
      startCamera
    );

    setupAI();

  </script>

</body>
</html>
