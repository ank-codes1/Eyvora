<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EYVORA</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    video {
      width: 700px;
      max-width: 95%;
      border-radius: 18px;
      border: 3px solid #38bdf8;
      margin-top: 18px;
    }

    button {
      margin: 12px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>EYVORA</h1>
  <h2>AI Driver Monitoring System</h2>

  <button id="startBtn">Start Camera + AI</button>

  <div>
    <video id="camera" autoplay playsinline></video>
  </div>

  <div id="status">AI Status: Loading...</div>

  <script type="module">

    import vision from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const {
      FaceLandmarker,
      FilesetResolver
    } = vision;

    const video = document.getElementById("camera");
    const status = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");

    let faceLandmarker;
    let lastVideoTime = -1;
    let cameraStarted = false;

    async function setupAI() {

      status.innerText = "AI Status: Loading MediaPipe...";

      const filesetResolver =
        await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
        );

      faceLandmarker =
        await FaceLandmarker.createFromOptions(
          filesetResolver,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
            },

            runningMode: "VIDEO",
            numFaces: 1,
            outputFaceBlendshapes: true
          }
        );

      status.innerText = "AI Status: Ready";
    }

    async function startCamera() {

      if (!faceLandmarker) {
        status.innerText = "AI Status: Still loading...";
        return;
      }

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

      video.srcObject = stream;

      video.addEventListener(
        "loadeddata",
        () => {
          cameraStarted = true;
          detectLoop();
        },
        { once: true }
      );
    }

    function detectLoop() {

      if (!cameraStarted) return;

      if (
        video.readyState >= 2 &&
        video.currentTime !== lastVideoTime
      ) {

        lastVideoTime = video.currentTime;

        const result =
          faceLandmarker.detectForVideo(
            video,
            performance.now()
          );

        if (
          result.faceLandmarks &&
          result.faceLandmarks.length > 0
        ) {

          status.innerText =
            "Driver: FACE DETECTED";

        } else {

          status.innerText =
            "Driver: NO FACE";

        }
      }

      requestAnimationFrame(detectLoop);
    }

    startBtn.addEventListener(
      "click",
      startCamera
    );

    setupAI();

  </script>

</body>
</html>
